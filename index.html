<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="文章の文字数、行数、段落数をすぐに確認できる無料の文字数カウンターです。入力内容は保存・送信されません。">
  <meta name="theme-color" content="#f4f1ea">
  <title>文字数カウンター | 文章をすばやく確認</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="文字数カウンター ホーム">
        <span class="brand-mark" aria-hidden="true">文</span>
        <span>文字数カウンター</span>
      </a>
      <div class="privacy-note"><span class="status-dot" aria-hidden="true"></span>入力内容はこの端末だけで処理</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">文字数をカウントできます</h1>
        <p class="intro-copy">文章を入力すると、文字数・行数・段落数を確認できます。</p>
      </section>

      <section class="workspace" aria-label="文字数カウンター">
        <div class="editor-heading">
          <label for="text-input">文章を入力</label>
          <button class="reset-button" id="reset-button" type="button" aria-label="入力内容をすべて消去">
            <span aria-hidden="true">↺</span> リセット
          </button>
        </div>
        <div class="editor-frame">
          <textarea id="text-input" rows="12" placeholder="ここに文章を入力、または貼り付けてください。" spellcheck="false" autofocus></textarea>
          <div class="editor-footer">
            <span id="input-state">入力待ち</span>
            <span>自動更新</span>
          </div>
        </div>

        <div class="stats" aria-live="polite" aria-atomic="true">
          <article class="stat-card stat-card-primary">
            <span class="stat-label">文字数 <small>空白・改行を除く</small></span>
            <strong id="character-count">0</strong>
            <span class="stat-unit">文字</span>
          </article>
          <article class="stat-card">
            <span class="stat-label">全体文字数</span>
            <strong id="total-count">0</strong>
            <span class="stat-unit">文字</span>
          </article>
          <article class="stat-card">
            <span class="stat-label">行数</span>
            <strong id="line-count">0</strong>
            <span class="stat-unit">行</span>
          </article>
          <article class="stat-card">
            <span class="stat-label">段落数</span>
            <strong id="paragraph-count">0</strong>
            <span class="stat-unit">段落</span>
          </article>
        </div>
      </section>

      <aside class="ad-slot" aria-label="広告掲載スペース">
        <span class="ad-slot-label">AD SPACE</span>
        <span>将来ここに広告を掲載できます</span>
      </aside>

      <section class="how-to" aria-labelledby="how-to-title">
        <div>
          <h2 id="how-to-title">使い方</h2>
        </div>
        <ol class="steps">
          <li><span>01</span><p>文章を入力する</p></li>
          <li><span>02</span><p>数字を確認する</p></li>
          <li><span>03</span><p>必要な長さに整える</p></li>
        </ol>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 文字数カウンター</span>
      <span>Privacy first. Always.</span>
    </footer>
  </div>
</body>
</html>
